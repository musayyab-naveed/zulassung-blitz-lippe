[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

[[redirects]]
  from = "/api/lead"
  to = "/.netlify/functions/lead"
  status = 200

# Alte Blog-Adressen dauerhaft auf die FAQ leiten
[[redirects]]
  from = "/blog"
  to = "/faq"
  status = 301

[[redirects]]
  from = "/blog/*"
  to = "/faq"
  status = 301

# Kein Sammel-Redirect auf index.html mehr: Jede Seite liegt als eigene HTML-Datei vor.
# Unbekannte Adressen bekommen so die echte Fehlerseite (404.html) mit Status 404 –
# vorher lieferte der Server die Startseite aus ("Soft 404", schlecht für Google).

# Übliche Sicherheits-Header: kein MIME-Raten, keine Einbettung auf fremden Seiten, sparsamer Referrer
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# Dateien mit Prüfsumme im Namen ändern sich nie – Browser dürfen sie ein Jahr behalten
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
